# Mantiene attivo il database Supabase gratuito: i progetti gratuiti possono
# essere messi in pausa dopo un periodo senza attività. Due volte a settimana
# chiama la funzione public.ping(), che non legge né restituisce dati.
name: Database sempre attivo
on:
  schedule:
    - cron: "17 6 * * 1,4"   # lunedì e giovedì, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al database
        run: |
          set -e
          URL="https://cbsqavoengtdloirtxxz.supabase.co/rest/v1/rpc/ping"
          KEY="sb_publishable_J71BnbbjiAyUE8D2UfsAjA_oSjRCLM_"   # chiave pubblica (vedi cloud-config.js)
          code=$(curl -s -o risposta.txt -w "%{http_code}" -X POST "$URL" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat risposta.txt)"
          test "$code" = "200"
